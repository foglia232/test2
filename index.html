:root{
  --cover:#7A2318; --cover-dk:#561409; --cover-lt:#92301F;
  --paper:#EDE3CC; --paper-2:#E3D6B8; --paper-3:#F4ECDA;
  --ink:#2A1F1A; --ink-2:#5E4E43; --ink-3:#8C7A6B;
  --zhu:#B23A2A; --zhu-soft:rgba(178,58,42,.14);
  --gold:#B08A45; --dai:#2F4858; --dai-soft:#DCE3E6;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --brush:"DNZ Brush","Ma Shan Zheng","STXingkai","KaiTi","Kaiti SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif);color:var(--ink);line-height:1.85;font-size:16px;
  background:var(--cover-dk);
  background-image:
    repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px);
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{max-width:540px;margin:0 auto;min-height:100vh;position:relative}

/* ---------- 通用按钮 ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  min-height:50px;padding:0 28px;border-radius:2px;font-size:17px;letter-spacing:.12em;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn-zhu{background:var(--zhu);color:#FBF3E4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 2px 0 var(--cover-dk)}
.btn-zhu:hover{background:#C2432F}
.btn-paper{background:var(--paper);color:var(--cover);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn-line{color:var(--ink-2);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--ink-3);min-height:44px;padding:0 8px;letter-spacing:.05em;font-size:15px}
.btn-line.light{color:#F1DFC4;text-decoration-color:rgba(241,223,196,.5)}

/* ---------- 封面 ---------- */
.cover{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;position:relative;
  background:var(--cover);
  background-image:
    radial-gradient(ellipse at 70% 20%,rgba(255,200,150,.10),transparent 60%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 4px);
  padding:28px 24px 24px 64px;color:#F4E6CF;overflow:hidden}
.cover::before{ /* 线装书的装订边 */
  content:"";position:absolute;left:0;top:0;bottom:0;width:40px;background:var(--cover-dk);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.08)}
.cover .stitch{position:absolute;left:0;width:52px;height:2px;background:#E9D9B9;opacity:.8}
.cover .stitch::after{content:"";position:absolute;left:26px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--cover-dk);box-shadow:0 0 0 1.5px #E9D9B9}
.cover-top{display:flex;gap:22px;align-items:flex-start;flex:1}
.tiqian{ /* 题签 */
  writing-mode:vertical-rl;background:var(--paper);color:var(--ink);
  padding:22px 14px;border:1px solid #C9B78F;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--zhu),0 3px 10px rgba(0,0,0,.3);
  font-family:var(--brush);font-size:clamp(34px,10vw,48px);line-height:1.15;letter-spacing:.06em;
  display:flex;gap:10px;flex-shrink:0;animation:rise .9s ease-out both}
.tiqian small{font-size:.5em;color:var(--zhu);letter-spacing:.2em;align-self:flex-end;font-family:var(--serif);font-weight:600}
.cover-side{padding-top:6px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cover-side .lead{font-size:18px;line-height:1.7;color:#F8EBD3}
.cover-side .facts{list-style:none;font-size:14px;color:#E3C9A6;line-height:2}
.cover-side .facts li::before{content:"";display:inline-block;width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin-right:10px;vertical-align:2px}
.cover-bottom{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding-top:28px}
.cover-bottom .btn-paper{font-size:19px;min-height:56px}
.cover .fine{font-size:12px;line-height:1.7;color:rgba(241,223,196,.62);margin-top:14px}

/* ---------- 纸页 ---------- */
.page{min-height:100vh;min-height:100svh;background:var(--paper);
  background-image:radial-gradient(ellipse at 50% 0%,var(--paper-3),transparent 70%),
    repeating-linear-gradient(0deg,rgba(120,90,50,.025) 0 1px,transparent 1px 3px);
  padding:18px 16px 32px;display:flex;flex-direction:column}
.frame{ /* 古籍版框：外粗内细 */
  border:3px solid var(--zhu);outline:1px solid var(--zhu);outline-offset:-8px;
  padding:30px 22px 26px;position:relative;flex:1;display:flex;flex-direction:column}
.frame.loose{flex:0 0 auto}

.prologue p{font-size:17.5px;margin-bottom:1.1em;color:var(--ink)}
.prologue p:first-child{font-family:var(--brush);font-size:30px;line-height:1.4;color:var(--cover)}
.prologue .tip{margin-top:auto;padding:14px 16px;background:var(--zhu-soft);font-size:14.5px;line-height:1.75;color:var(--ink-2);border-left:3px solid var(--zhu)}
.page .actions{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:22px}


/* 答题 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-2);padding:0 4px 8px;letter-spacing:.06em}
.qhead b{color:var(--zhu);font-weight:600}
.bar{height:3px;background:var(--paper-2);margin:0 4px 16px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--zhu);transition:width .35s ease}
.qno{font-family:var(--brush);font-size:24px;color:var(--zhu);line-height:1}
.qscene{font-size:17.5px;line-height:1.85;margin:14px 0 10px;color:var(--ink)}
.qask{font-size:18px;font-weight:700;color:var(--cover);margin-bottom:18px;letter-spacing:.04em}
.qgap{height:8px}
.chban{text-align:center;padding:2px 0 18px;margin-bottom:18px;border-bottom:1px dashed #CDBB95;animation:rise .5s ease-out both}
.chban .chno{font-size:13px;letter-spacing:.4em;color:var(--zhu);font-weight:600}
.chban .chti{font-family:var(--brush);font-size:40px;line-height:1.3;letter-spacing:.15em;color:var(--ink)}
.chban .chin{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.opts{list-style:none;display:flex;flex-direction:column;gap:10px}
.opt{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px 16px;
  background:var(--paper-3);border:1px solid #D2C29E;border-radius:2px;font-size:16px;line-height:1.7;transition:background .15s,border-color .15s}
.opt b{flex-shrink:0;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--zhu);color:var(--zhu);
  font-weight:600;font-size:14px;margin-top:1px;transition:background .15s,color .15s}
.opt:hover{border-color:var(--zhu)}
.opt.on{background:#F7E2D5;border-color:var(--zhu)}
.opt.on b{background:var(--zhu);color:#FFF4E8}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}

/* 镜外：醒来以后的现实页面 */
.page.mirror{background:#EEF1F1;background-image:none;font-family:var(--sans)}
.page.mirror .frame{border:1px solid #B9C6CC;outline:none;border-radius:10px;background:#fff}
.page.mirror .qno{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--dai)}
.page.mirror .qhead b{color:var(--dai)}
.page.mirror .bar i{background:var(--dai)}
.page.mirror .opt{background:#F6F8F8;border-color:#D3DCDF;border-radius:8px;font-family:var(--sans)}
.page.mirror .opt b{border-color:var(--dai);color:var(--dai);border-radius:50%}
.page.mirror .opt.on{background:var(--dai-soft);border-color:var(--dai)}
.page.mirror .opt.on b{background:var(--dai);color:#fff}
.page.mirror .btn-zhu{background:var(--dai);box-shadow:none;border-radius:8px}
.page.mirror .qask{color:var(--dai)}
.page.mirror .chban{border-bottom-color:#C9D3D7}
.page.mirror .chban .chno{color:var(--dai)}
.page.mirror .chban .chti{font-family:var(--sans);font-weight:300;font-size:30px;color:var(--dai);letter-spacing:.3em}

/* 推演中 */
.loading{align-items:center;justify-content:center;text-align:center;gap:22px}
.loading .seal-spin{width:86px;height:86px;border:3px solid var(--zhu);display:grid;place-items:center;
  font-family:var(--brush);font-size:40px;color:var(--zhu);animation:breathe 1.2s ease-in-out infinite}

<script>
/* 计分引擎：原始分 → 相对随机作答的标准分 → 与 16 位人物画像比对 */
(function (E) {
  var KEYS = ['z', 'm', 'g', 'r', 'd', 'h', 'c', 'j'];
  E.KEYS = KEYS;

  /* 每个维度在"随机作答"下的均值与标准差（解析计算，不需要样本） */
  E.stats = function (D) {
    var mu = {}, v = {}, sd = {};
    KEYS.forEach(function (k) { mu[k] = 0; v[k] = 0; });
    D.questions.forEach(function (q) {
      var n = q.opts.length;
      KEYS.forEach(function (k) {
        var s = 0, s2 = 0;
        q.opts.forEach(function (o) { var x = o.w[k] || 0; s += x; s2 += x * x; });
        var m = s / n; mu[k] += m; v[k] += s2 / n - m * m;
      });
    });
    KEYS.forEach(function (k) { sd[k] = Math.sqrt(v[k]) || 1; });
    return { mu: mu, sd: sd };
  };

  /* 人物画像：突出项 +1.2，次突出 +0.5，最弱项 -1.0，次弱 -0.5 */
  E.proto = function (c) {
    return KEYS.map(function (k) {
      if (c.hi.indexOf(k) > -1) return 1.2;
      if ((c.lo || []).indexOf(k) > -1) return -1.0;
      if ((c.mid || []).indexOf(k) > -1) return 0.5;
      if ((c.lo2 || []).indexOf(k) > -1) return -0.5;
      return 0;
    });
  };

  E.phi = function (x) { /* 标准正态分布函数 */
    var t = 1 / (1 + 0.2316419 * Math.abs(x));
    var d = 0.3989423 * Math.exp(-x * x / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return x > 0 ? 1 - p : p;
  };

  var _st = null;
  E.analyze = function (D, answers, bias) {
    bias = bias || {};
    var st = _st || (_st = E.stats(D));
    var raw = {};
    KEYS.forEach(function (k) { raw[k] = 0; });
    answers.forEach(function (oi, qi) {
      if (oi == null) return;
      var w = D.questions[qi].opts[oi].w;
      for (var k in w) raw[k] += w[k];
    });
    var z = KEYS.map(function (k) { return (raw[k] - st.mu[k]) / st.sd[k]; });
    var ranking = D.characters.map(function (c, ci) {
      var p = E.proto(c), d = 0;
      for (var i = 0; i < 8; i++) d += (z[i] - p[i]) * (z[i] - p[i]);
      return { ci: ci, c: c, p: p, d: d - (bias[c.id] || 0) };
    }).sort(function (a, b) { return a.d - b.d; });
    var scores = z.map(function (x) { return Math.round(Math.min(97, Math.max(6, E.phi(x) * 100))); });
    return { raw: raw, z: z, scores: scores, ranking: ranking };
  };
})(typeof module !== 'undefined' ? module.exports : (window.Engine = {}));

<script>
(function () {

  function show(html) { app.innerHTML = html; window.scrollTo(0, 0); }
  function on(sel, fn) { app.querySelectorAll(sel).forEach(function (el) { el.addEventListener('click', fn); }); }
  function fmtDate(t) { var d = new Date(t); function p(n) { return n < 10 ? '0' + n : n; } return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  }

  /* ---------- 封面 ---------- */
  function home() {

      '<section class="cover">' + stitches +

      '<p class="lead">醒来那天，你只有一本写了一半的手记。接下来怎么走，由你来选。</p>' +

  /* ---------- 报告 ---------- */
  function pickCallback(ans, k, used) {
    var best = -1, bw = 0;
    for (var qi = 0; qi < NQ; qi++) {

      if (q.mirror || ans[qi] == null || used[qi]) continue;

      if (w > bw) { bw = w; best = qi; }

    if (best < 0) return '';
    used[best] = 1;
    return D.questions[best].opts[ans[best]].cb;
  }

  function analyzeFull(ans) {
    var r = E.analyze(D, ans, CB.bias);
    var top = r.ranking[0], c = top.c, p = top.p, z = r.z;
    var order = K.map(function (k, i) { return i; }).sort(function (a, b) { return z[b] - z[a]; });
    var protoScores = p.map(function (v) { return Math.round(50 + v * 30); });

    var lowI = order[7], ally = null, av = -1e9;

  function radarSVG(vals, proto) {
    var S = 340, cx = 170, cy = 170, R = 112, n = 8;
    function pt(i, f) { var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; }

    for (var i = 0; i < n; i++) { var e = pt(i, 1); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="#D9CBA9" stroke-width="1"/>'; }

    g += '<polygon points="' + poly(vals.map(function (v) { return v / 100; })) + '" fill="rgba(178,58,42,.2)" stroke="#B23A2A" stroke-width="2.4" stroke-linejoin="round"/>';
    vals.forEach(function (v, i) { var q = pt(i, v / 100); g += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3.6" fill="#B23A2A"/>'; });
    K.forEach(function (k, i) {
      var q = pt(i, 1.24);
      g += '<text x="' + q[0] + '" y="' + (q[1] + 5) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#2A1F1A" font-family="Noto Serif SC,Songti SC,serif">' + DIM[k].name + '</text>';
      g += '<text x="' + q[0] + '" y="' + (q[1] + 22) + '" text-anchor="middle" font-size="12" fill="#B23A2A" font-family="Noto Serif SC,Songti SC,serif">' + vals[i] + '</text>';

    return '<svg viewBox="-10 -6 ' + (S + 20) + ' ' + (S + 22) + '" role="img" aria-label="八维蛛网图">' + g + '</svg>';
  }

  function sealHTML(title) {

  }

  function report(rec) {
    var ans = rec.a, A = analyzeFull(ans), c = A.c, z = A.z, s = A.r.scores;
    var used = {};
    var topK = K[A.order[0]], lowK = K[A.order[7]];

    /* 你们最像的地方 */

      return { h: DIM[k].head, b: c.like[k], cb: cb };

    if (c.hi.indexOf(topK) < 0) {
      var cb3 = pickCallback(ans, topK, used);
      pts.push({ h: '另外，你自己最突出的一项是' + DIM[topK].name, b: DIM[topK].hi, cb: cb3 });

    var ptsHTML = pts.map(function (x) {

    }).join('');

    /* 和她不一样的地方 */
    var diffs = K.map(function (k, i) { return { k: k, d: z[i] - A.p[i] }; })
      .sort(function (a, b) { return Math.abs(b.d) - Math.abs(a.d); })
      .filter(function (x) { return Math.abs(x.d) > 0.45; }).slice(0, 2);

    var scriptHTML =
      '<div class="card"><p class="k">你的封号</p><p class="big">' + DIM[topK].feng + '妃</p><p>' + esc(DIM[topK].fengWhy) + '</p></div>' +
      '<div class="card"><p class="k">宫中稀有度</p><p class="big">约 ' + Math.max(3, Math.round(CB.rarity[c.id] || 6)) + '%</p><p>的人测出' + esc(c.name) + '。</p></div>' +
      '<div class="card wide"><p class="k">你在宫中的结局</p><p>' + esc(c.ending) + '</p></div>' +
      '<div class="card wide"><p class="k">最佳盟友</p><p class="big">' + esc(ally.name) + '</p><p>' + esc(allyText) + '</p></div>' +
      '<div class="card wide"><p class="k">天生对手</p><p class="big">' + esc(rival.name) + '</p><p>她把' + DIM[rK].name + '看得很重，你却觉得没那么要紧。你们见了面，大概会客客气气地喝完一盏茶，然后各自回宫生闷气。</p></div>';

    /* 镜外 */
    var groups = [{ key: 'work', t: '工作和成长里' }, { key: 'love', t: '亲近的关系里' }, { key: 'self', t: '低谷的时候' }];
    var mirHTML = '';
    groups.forEach(function (g) {
      D.questions.forEach(function (q, qi) {
        if (q.mirror !== g.key || ans[qi] == null) return;
        var o = q.opts[ans[qi]];
        mirHTML += '<div class="mir"><p class="tag">' + g.t + '｜' + esc(q.label || '') + '</p>' +
          '<p class="you">你的选择：' + esc(o.t) + '</p><p>' + esc(o.read) + '</p><p class="tipline">' + esc(o.tip) + '</p></div>';
      });
    });

    var longName = c.name.length >= 4;
    show(
      '<article class="report">' +
      '<header class="hero"><p class="kicker">你的历史大女主原型</p><div class="hero-body">' +
      '<h1 class="hero-name' + (longName ? ' long' : '') + '">' + esc(c.name) + '</h1>' +
      '<div class="hero-info">' + sealHTML(c.title) +
      '<p class="hero-era">' + esc(c.era) + '</p>' +
      '<p class="hero-tag">「' + esc(c.tagline) + '」</p>' +
      '<p class="hero-meta">相关影视：' + esc(c.dramas.join('')) + '<br>' + esc(fmtDate(rec.t)) + ' 测出</p>' +
      '</div></div></header>' +

      '<section class="sec"><p class="lead-p">' + esc(c.intro) + '</p></section>' +

      '<section class="sec"><h3>你的八维蛛网</h3>' +
      '<div class="radar-wrap">' + radarSVG(s, A.protoScores) +
      '<div class="legend"><span><i></i>你</span><span><i class="p"></i>' + esc(c.name) + '的典型轮廓</span></div></div>' +
      '<p class="muted">分数是和随机作答相比，你在这一项上的倾向有多强，不代表能力高低。</p>' +
      '<ul class="dims">' + dimsHTML + '</ul></section>' +

      '<section class="sec"><h3>你和她，最像的地方</h3><ol class="points">' + ptsHTML + '</ol></section>' +

      '<section class="sec"><h3>你和她，不一样的地方</h3>' + diffHTML +
      '<p class="muted">你测出的，是' + esc(c.name) + '身上的这一条路线，而不是她的全部人生。</p></section>' +

      '<section class="sec"><h3>你的宫中剧本</h3><div class="script">' + scriptHTML + '</div></section>' +

      '<section class="sec"><h3>镜外的你</h3><p class="muted" style="margin-bottom:14px">梦醒以后，那 5 道现实题里的你。</p>' + mirHTML + '</section>' +

      '<section class="sec"><h3>她的代价，你的提醒</h3><p>' + esc(c.cost) + '</p>' +
      '<div class="card" style="margin:6px 0 14px"><p class="k">给你的一个小练习</p><p>你八维里最弱的一项是' + DIM[lowK].name + '。' + esc(D.growth[lowK]) + '</p></div></section>' +

      '<section class="sec archive"><h3>人物小档案</h3><p>' + esc(c.history) + '</p>' +
      '<p class="dr">相关影视：' + esc(c.dramas.join('')) + '。影视作品情节经过艺术加工，与史实并不相同。</p></section>' +

      '<footer class="share-box"><p class="line">' + esc(c.share) + '</p><div class="btns">' +
      '<button class="btn btn-paper" id="card">生成分享卡</button>' +
      '<button class="btn-line light" id="again">再测一次</button>' +
      '<button class="btn-line light" id="hist">我的测试记录</button>' +
      '<button class="btn-line light" id="home">回到封面</button></div>' +
      '<p class="fine">' + esc(D.meta.disclaimer) + '</p></footer>' +
      '</article>'
    );
    on('#card', function () { shareCard(c, s, A.protoScores); });
    on('#again', prologue);
    on('#hist', historyScreen);
    on('#home', home);
  }

  /* ---------- 测试记录 ---------- */
  function historyScreen() {
    var h = loadHist();
    var CH = {}; D.characters.forEach(function (c) { CH[c.id] = c; });
    var list = h.map(function (rec, i) {
      var c = CH[rec.id]; if (!c) return '';
      return '<li><span class="mini">' + esc(c.name.slice(0, 1)) + '</span><span class="info"><b>' + esc(c.name) + '</b><span>' + esc(fmtDate(rec.t)) + '</span></span>' +
        '<button class="go" data-i="' + i + '">看报告</button><button class="del" data-i="' + i + '" aria-label="删除这条记录">删除</button></li>';
    }).join('');
    show(
      '<section class="page"><div class="frame">' +
      '<p class="qno">测试记录</p>' +
      '<p class="muted" style="margin:8px 0 6px">记录只保存在这台设备的浏览器里，清除浏览器数据后会消失。</p>' +
      (h.length ? '<ul class="hist-list">' + list + '</ul>' : '<div class="empty"><p>还没有记录。翻开手记，测第一次吧。</p></div>') +
      '<div class="actions"><button class="btn btn-zhu" id="start">' + (h.length ? '再测一次' : '开始测试') + '</button>' +
      '<button class="btn-line" id="home">回到封面</button></div>' +
      '</div></section>'
    );
    on('.go', function (e) { report(h[+e.currentTarget.getAttribute('data-i')]); });
    on('.del', function (e) {
      var i = +e.currentTarget.getAttribute('data-i');
      if (!window.confirm('删除这条记录？删除后无法恢复。')) return;
      h.splice(i, 1); saveHist(h); historyScreen();
    });
    on('#start', prologue);
    on('#home', home);
  }

  /* ---------- 分享卡 ---------- */
  function shareCard(c, vals, proto) {
    var W = 1080, H = 1500, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    var BR = '"DNZ Brush","Ma Shan Zheng","STXingkai","KaiTi",serif', SE = '"Noto Serif SC","Songti SC","STSong",serif';
    var ready = (document.fonts && document.fonts.load) ? Promise.all([
      document.fonts.load('80px "DNZ Brush"', c.name + c.title + c.share),
      document.fonts.load('700 40px "Noto Serif SC"', c.tagline)
    ]).catch(function () { }) : Promise.resolve();
    ready.then(function () {
      x.fillStyle = '#7A2318'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#EDE3CC'; x.fillRect(60, 60, W - 120, H - 120);
      x.strokeStyle = '#B23A2A'; x.lineWidth = 8; x.strokeRect(90, 90, W - 180, H - 180);
      x.lineWidth = 2; x.strokeRect(108, 108, W - 216, H - 216);

      x.fillStyle = '#5E4E43'; x.font = '36px ' + SE; x.textAlign = 'left';
      x.fillText('我的历史大女主原型', 160, 200);
      /* 竖排人名 */
      var fs = c.name.length >= 4 ? 132 : 172;
      x.fillStyle = '#2A1F1A'; x.font = fs + 'px ' + BR; x.textAlign = 'center';
      for (var i = 0; i < c.name.length; i++) x.fillText(c.name[i], 270, 390 + i * fs * 1.03);
      /* 印章 */
      x.save(); x.translate(780, 320); x.rotate(-0.1);
      x.fillStyle = '#B23A2A'; x.fillRect(-100, -100, 200, 200);
      x.strokeStyle = '#FFF1E2'; x.lineWidth = 5; x.strokeRect(-87, -87, 174, 174);
      x.fillStyle = '#FFF1E2'; x.font = '72px ' + BR; x.textAlign = 'center';
      var t = c.title;
      x.fillText(t[0], 38, -10); x.fillText(t[1], 38, 66); x.fillText(t[2], -38, -10); x.fillText(t[3], -38, 66);
      x.restore();
      /* 气质句 */
      x.fillStyle = '#7A2318'; x.font = '700 38px ' + SE; x.textAlign = 'left';
      wrap(x, '「' + c.tagline + '」', 470, 520, 440, 58);
      /* 小蛛网 */
      var cx = 690, cy = 910, R = 145;
      function P(i, f) { var a = -Math.PI / 2 + i * Math.PI / 4; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; }
      function path(fs2) { x.beginPath(); fs2.forEach(function (f, i) { var q = P(i, f); i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); }); x.closePath(); }
      x.strokeStyle = '#CDBB95'; x.lineWidth = 2;
      [0.33, 0.66, 1].forEach(function (f) { path(new Array(8).fill(f)); x.stroke(); });
      path(proto.map(function (v) { return v / 100; })); x.setLineDash([12, 10]); x.strokeStyle = '#2F4858'; x.lineWidth = 3; x.stroke(); x.setLineDash([]);
      path(vals.map(function (v) { return v / 100; })); x.fillStyle = 'rgba(178,58,42,.22)'; x.fill(); x.strokeStyle = '#B23A2A'; x.lineWidth = 5; x.stroke();
      x.fillStyle = '#2A1F1A'; x.font = '700 28px ' + SE; x.textAlign = 'center';
      K.forEach(function (k, i) { var q = P(i, 1.25); x.fillText(DIM[k].name, q[0], q[1] + 10); });
      /* 分隔线 + 分享句 */
      x.strokeStyle = '#CDBB95'; x.lineWidth = 2; x.beginPath(); x.moveTo(180, 1140); x.lineTo(900, 1140); x.stroke();
      var parts = c.share.split('：');
      x.fillStyle = '#8C7A6B'; x.font = '32px ' + SE; x.textAlign = 'center';
      x.fillText(parts.length > 1 ? parts[0] : '我的大女主底牌', W / 2, 1205);
      x.fillStyle = '#7A2318'; x.font = '78px ' + BR;
      wrap(x, (parts[1] || parts[0]).replace(/。$/, ''), W / 2, 1295, 760, 88);
      x.fillStyle = '#8C7A6B'; x.font = '26px ' + SE;
      x.fillText(D.meta.title, W / 2, 1365);

      var url = cv.toDataURL('image/png');
      var ov = document.createElement('div');
      ov.className = 'overlay';
      ov.innerHTML = '<img alt="分享卡" src="' + url + '"><p>手机上可以长按图片保存</p><div class="row">' +
        '<a class="btn btn-paper" download="大女主-' + esc(c.name) + '.png" href="' + url + '">下载图片</a>' +
        '<button class="btn-line light" id="close">关闭</button></div>';
      document.body.appendChild(ov);
      ov.querySelector('#close').addEventListener('click', function () { ov.remove(); });
      ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    });
  }
  function wrap(x, text, X, Y, maxW, lh, center) {
    var line = '', y = Y;
    for (var i = 0; i < text.length; i++) {
      var test = line + text[i];
      if (x.measureText(test).width > maxW && line) { x.fillText(line, X, y); line = text[i]; y += lh; }
      else line = test;
    }
    x.fillText(line, X, y);
  }

  /* ---------- 预览（给作者看的隐藏页：地址后面加 #all） ---------- */
  function idealAnswers(c) {
    var p = E.proto(c);
    return D.questions.map(function (q) {
      var best = 0, bv = -1e9;
      q.opts.forEach(function (o, i) { var s = 0; K.forEach(function (k, ki) { s += (o.w[k] || 0) * p[ki]; }); if (s > bv) { bv = s; best = i; } });
      return best;
    });
  }
  function previewList() {
    show('<section class="page"><div class="frame"><p class="qno">16 份结果预览</p>' +
      '<p class="muted" style="margin:8px 0">作者预览用：每份报告按这位人物的"典型作答"生成，不会存进测试记录。</p><ul class="hist-list">' +
      D.characters.map(function (c) {
        return '<li><span class="mini">' + esc(c.name[0]) + '</span><span class="info"><b>' + esc(c.name) + '</b><span>' + esc(c.title) + '</span></span>' +
          '<a class="go" href="#preview=' + c.id + '">看报告</a></li>';
      }).join('') + '</ul><div class="actions"><button class="btn-line" id="home">回到封面</button></div></div></section>');
    on('#home', function () { location.hash = ''; home(); });
  }
  function route() {
    var h = location.hash;
    if (h === '#all') return previewList();
    var m = h.match(/^#preview=(\w+)/);
    if (m) {
      var c = D.characters.filter(function (x) { return x.id === m[1]; })[0];
      if (c) return report({ t: Date.now(), a: idealAnswers(c) });
    }
    home();
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
